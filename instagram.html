<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>ورود به اینستاگرام | سپید</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fafafa; color: #262626; font-family: Tahoma, Arial, sans-serif; }
    main { width: min(100%, 390px); text-align: center; }
    .card { padding: 36px 28px 28px; background: #fff; border: 1px solid #dbdbdb; border-radius: 12px; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0 0 24px; color: #737373; font-size: 14px; line-height: 2; }
    a { display: block; padding: 12px 18px; border-radius: 8px; background: #46694e; color: white; text-decoration: none; font-weight: bold; }
    a:hover { background: #35523b; }
    .profile { margin-top: 16px; background: #f1f3f1; color: #333; }
    small { display: block; margin-top: 20px; color: #737373; line-height: 1.9; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>ورود به اینستاگرام</h1>
      <p>برای ورود امن، از صفحهٔ رسمی اینستاگرام استفاده کنید. این سایت گذرواژهٔ شما را دریافت یا ذخیره نمی‌کند.</p>
      <a href="https://www.instagram.com/accounts/login/" target="_blank" rel="noopener noreferrer">رفتن به ورود رسمی اینستاگرام</a>
      <a class="profile" href="https://www.instagram.com/najmeh.ahmadloo/" target="_blank" rel="noopener noreferrer">مشاهدهٔ پروفایل najmeh.ahmadloo</a>
      <small>اطلاعات ورودتان را فقط در دامنهٔ رسمی instagram.com وارد کنید.</small>
    </section>
  </main>
</body>
</html>
