<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef0f3">
  <title>نمایش محیط توسعه روی موبایل</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #3d4652;
      --muted: #788493;
      --line: #d7dce2;
      --blue: #477fce;
      --paper: #f4f4f2;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      padding: 18px;
      display: grid;
      place-items: center;
      background: #e6e9ed;
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    .laptop-screen {
      width: min(100%, 1120px);
      min-height: 690px;
      overflow: hidden;
      position: relative;
      background: var(--paper);
      border: 1px solid #cdd2d8;
      border-radius: 12px;
      box-shadow: 0 22px 60px rgba(30, 40, 55, .18);
    }

    .editor {
      height: 455px;
      position: relative;
      background: linear-gradient(110deg, #f8f8f6, #f0f0ed);
    }

    .editor-mark {
      position: absolute;
      left: 50%;
      top: 4px;
      width: 215px;
      height: 240px;
      transform: translateX(-50%);
      opacity: .14;
    }

    .editor-mark::before, .editor-mark::after {
      content: "";
      position: absolute;
      top: 20px;
      width: 72px;
      height: 200px;
      background: #4776b9;
      border-radius: 18px;
    }

    .editor-mark::before { left: 46px; transform: rotate(42deg); }
    .editor-mark::after { right: 46px; transform: rotate(-42deg); }

    .welcome {
      position: absolute;
      left: 50%;
      top: 285px;
      width: min(380px, 90%);
      transform: translateX(-50%);
      display: grid;
      gap: 12px;
      color: #78818d;
      font-size: 13px;
      direction: ltr;
    }

    .welcome-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .welcome-label { display: flex; align-items: center; gap: 10px; }
    .welcome-icon { width: 16px; text-align: center; color: #718198; }
    kbd {
      padding: 2px 6px;
      border: 1px solid #e0e3e7;
      border-radius: 4px;
      background: #f7f7f6;
      color: #737d89;
      font: 11px "Segoe UI", sans-serif;
      white-space: nowrap;
    }

    .bottom-panel { min-height: 235px; border-top: 1px solid var(--line); background: rgba(248,248,247,.86); }
    .tabs {
      min-height: 43px;
      display: flex;
      align-items: stretch;
      gap: 18px;
      padding: 0 18px;
      border-bottom: 1px solid #e2e5e8;
      color: #697483;
      font-size: 13px;
      direction: ltr;
    }
    .tab { display: flex; align-items: center; padding: 0 4px; white-space: nowrap; }
    .tab.active { border-bottom: 2px solid var(--blue); color: #3e4c5c; }

    .table-head {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1.5fr 1fr .8fr;
      gap: 10px;
      padding: 12px 24px;
      color: #66717e;
      font-size: 12px;
      direction: ltr;
    }

    .port-entry {
      width: min(520px, calc(100% - 48px));
      margin: 0 24px;
      padding: 8px 10px;
      border: 1px solid #d5dbe2;
      border-radius: 4px;
      color: #87919d;
      background: #fff;
      font-size: 12px;
      direction: ltr;
    }

    .hint {
      width: 150px;
      margin: 0 24px;
      padding: 8px;
      border: 1px solid #cbd1d9;
      background: #fff;
      color: #65707d;
      font-size: 12px;
      line-height: 1.5;
      direction: ltr;
    }

    .taskbar {
      height: 42px;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      border-top: 1px solid #cdd2d8;
      background: rgba(226,230,234,.9);
      color: #627080;
      font-size: 12px;
      direction: ltr;
    }
    .windows { font-size: 18px; color: #4882cf; }
    .search { width: 180px; padding: 6px 10px; border: 1px solid #cbd2d9; border-radius: 14px; background: #f5f6f7; }
    .app-icons { display: flex; gap: 12px; margin-left: auto; }
    .app-icon { width: 16px; height: 16px; border-radius: 4px; background: #5b9ed4; opacity: .8; }
    .app-icon:nth-child(2n) { background: #8a74bc; }
    .app-icon:nth-child(3n) { background: #55a778; }

    @media (max-width: 640px) {
      body { display: block; padding: 0; background: #edf0f3; }
      .laptop-screen { width: 100%; min-height: 100vh; min-height: 100svh; border: 0; border-radius: 0; box-shadow: none; }
      .editor { height: 48vh; height: 48svh; min-height: 310px; max-height: 440px; }
      .editor-mark { width: 150px; height: 172px; top: 12px; }
      .editor-mark::before, .editor-mark::after { top: 18px; width: 50px; height: 140px; border-radius: 14px; }
      .editor-mark::before { left: 30px; }
      .editor-mark::after { right: 30px; }
      .welcome { top: auto; bottom: 28px; width: min(330px, calc(100% - 36px)); gap: 10px; font-size: 12px; }
      .bottom-panel { min-height: 250px; }
      .tabs { gap: clamp(8px, 3vw, 18px); padding: 0 12px; font-size: 12px; overflow-x: auto; }
      .table-head { grid-template-columns: 1fr 1.15fr 1.2fr; gap: 6px; padding: 12px; font-size: 11px; }
      .table-head span:nth-child(n+4) { display: none; }
      .port-entry { width: calc(100% - 24px); margin: 0 12px; }
      .hint { margin: 0 12px; }
      .taskbar { position: fixed; height: 42px; padding: 0 10px; gap: 10px; }
      .search { width: min(42vw, 180px); }
      .app-icons { gap: 8px; }
    }

    @media (max-width: 360px) {
      .tabs { gap: 7px; padding: 0 8px; font-size: 11px; }
      .table-head { font-size: 10px; }
      .welcome-row { gap: 6px; }
      kbd { padding: 2px 4px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="laptop-screen" aria-label="نمایش واکنش‌گرای محیط توسعه">
    <section class="editor" aria-label="صفحهٔ آغازین ویرایشگر">
      <div class="editor-mark" aria-hidden="true"></div>
      <div class="welcome">
        <div class="welcome-row"><span class="welcome-label"><span class="welcome-icon">▢</span>Open Chat</span><span><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>I</kbd></span></div>
        <div class="welcome-row"><span class="welcome-label"><span class="welcome-icon">☷</span>Show All Commands</span><span><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>P</kbd></span></div>
        <div class="welcome-row"><span class="welcome-label"><span class="welcome-icon">⚙</span>Open Settings</span><span><kbd>Ctrl</kbd> + <kbd>,</kbd></span></div>
      </div>
    </section>

    <section class="bottom-panel" aria-label="پنل پورت‌ها">
      <nav class="tabs" aria-label="پنل‌های ویرایشگر">
        <span class="tab">Problems</span><span class="tab">Output</span><span class="tab">Terminal</span><span class="tab active">Ports</span>
      </nav>
      <div class="table-head"><span>Port</span><span>Forwarded Address</span><span>Running Process</span><span>Visibility</span><span>Origin</span></div>
      <div class="port-entry">Port number or address</div>
      <div class="hint">Forwarded port should be a number or a hostname.</div>
    </section>

    <div class="taskbar" aria-label="نوار وظیفه">
      <span class="windows" aria-hidden="true">▦</span>
      <span class="search">Type here to search</span>
      <div class="app-icons" aria-hidden="true"><span class="app-icon"></span><span class="app-icon"></span><span class="app-icon"></span><span class="app-icon"></span><span class="app-icon"></span></div>
    </div>
  </main>
</body>
</html>
